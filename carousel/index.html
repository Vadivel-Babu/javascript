<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>carousel</title>
    <style>
      .carousel {
        width: 400px; /* visible area */
        height: 300px;
        overflow: hidden;
        margin: auto;
      }

      .img-container {
        display: flex; /* align slides horizontally */
        transition: transform 0.5s ease-in-out;
        width: 100%;
        height: 100%;
      }
      /* .img-container {
        width: 300px;
        height: 200px;
        border: 1px solid black;
        display: flex;
        overflow: hidden;
      } */
      .img {
        min-width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
      }
      .img:nth-child(1) {
        background-color: lightcoral;
      }
      .img:nth-child(2) {
        background-color: rgb(173, 193, 230);
      }
      .img:nth-child(3) {
        background-color: lightgreen;
      }
    </style>
  </head>
  <body>
    <div class="carousel">
      <!-- viewport -->
      <div class="img-container">
        <div class="img">1</div>
        <div class="img">2</div>
        <div class="img">3</div>
      </div>
    </div>
    <div class="btns">
      <button>prev</button>
      <button>next</button>
    </div>
    <script>
      const imgContainer = document.querySelector(".img-container");
      const imgs = document.querySelectorAll(".img");
      const prevBtn = document.querySelector(".btns button:first-child");
      const nextBtn = document.querySelector(".btns button:last-child");
      const totalImgs = imgs.length;

      let index = 0;

      prevBtn.addEventListener("click", () => {
        index -= 1;

        if (index < 0) {
          index = totalImgs - 1;
        }

        imgContainer.style.transform = `translateX(${-index * 100}%)`;
      });
      nextBtn.addEventListener("click", () => {
        index += 1;
        if (index >= totalImgs) {
          index = 0;
        }

        imgContainer.style.transform = `translateX(${-index * 100}%)`;
      });
    </script>
  </body>
</html>
